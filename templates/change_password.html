<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Смена пароля — ИИ-помощник {{ company_name() }}</title>
    <link rel="icon" href="/static/img/favicon.png" type="image/png">
    <link rel="shortcut icon" href="/favicon.ico" type="image/png">
    <link rel="stylesheet" href="/static/css/style.css?v=53">
</head>
<body class="login-body">
    <main class="main main--login">
        <div class="login-card">
            <div class="login-brand">
                <h1 class="login-title">Смена пароля</h1>
            </div>

            <p class="login-hint">
                Пользователь <strong>{{ user.login }}</strong
                >{% if forced %}. Пароль выдан временно — задайте свой, чтобы продолжить работу.
                {% else %}. После смены пароля другие сессии завершатся.{% endif %}
            </p>

            <form method="post" action="/api/auth/password" class="login-form" id="passwordForm">
                <label class="login-field">
                    <span class="login-label">Текущий пароль</span>
                    <input type="password" name="current_password" id="currentPassword"
                           class="settings-input" required autofocus
                           autocomplete="current-password" maxlength="256">
                </label>

                <label class="login-field">
                    <span class="login-label">Новый пароль</span>
                    <input type="password" name="new_password" id="newPassword"
                           class="settings-input" required minlength="8"
                           autocomplete="new-password" maxlength="256">
                    <span class="login-hint">Не короче 8 символов.</span>
                </label>

                <p class="settings-error" id="passwordError" role="alert" {% if not error %}hidden{% endif %}>
                    {{ error }}
                </p>

                <button type="submit" class="btn btn-primary login-submit">Сохранить пароль</button>
            </form>

            <form method="post" action="/logout" class="login-logout">
                <button type="submit" class="btn btn-secondary">Выйти</button>
            </form>
        </div>
    </main>

<script>
    // Форма шлёт JSON, а не обычным POST: обработчик ждёт тело JSON.
    document.getElementById('passwordForm').addEventListener('submit', async function (event) {
        event.preventDefault();
        var errorBox = document.getElementById('passwordError');
        errorBox.hidden = true;
        try {
            var response = await fetch('/api/auth/password', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    current_password: document.getElementById('currentPassword').value,
                    new_password: document.getElementById('newPassword').value
                })
            });
            var data = await response.json().catch(function () { return {}; });
            if (response.ok) {
                window.location.href = '/login';
                return;
            }
            errorBox.textContent = data.detail || 'Не удалось сменить пароль';
            errorBox.hidden = false;
        } catch (err) {
            errorBox.textContent = 'Сервер недоступен';
            errorBox.hidden = false;
        }
    });
</script>
</body>
</html>
